name: Rebuild selective original-based graphics
on:
  push:
    branches:
      - graphics/material-restoration
    paths:
      - '.github/workflows/rebuild-selective-graphics.yml'
      - 'scripts/restore-material-art.py'
      - 'asteroids.lua'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0' 'numpy==2.3.3'
      - name: Regenerate every colour texture directly from upstream
        run: python scripts/restore-material-art.py
      - name: Verify dimensions, transparency, assets and allowed file count
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          icons = list(Path('graphics/icons').glob('*.png'))
          diffuse = list(Path('graphics/entity/asteroid').rglob('*-colour-01.png'))
          assert len(icons) == 56, len(icons)
          assert len(diffuse) == 40, len(diffuse)
          for file in icons:
              with Image.open(file) as im:
                  assert im.size == (64,64), (file, im.size)
                  assert im.convert('RGBA').getchannel('A').getextrema() == (0,255), file
          for file in diffuse:
              with Image.open(file) as im:
                  assert im.convert('RGBA').getchannel('A').getextrema()[1] == 255, file
          print(f'Validated {len(icons)} icons and {len(diffuse)} material maps')
          PY
      - name: Commit only asset changes on the graphics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics/icons graphics/entity/asteroid
          if ! git diff --cached --quiet; then
            git commit -m "art(asteroids): restore original textures with selectively edited mineral features"
            git push origin HEAD:graphics/material-restoration
          fi
