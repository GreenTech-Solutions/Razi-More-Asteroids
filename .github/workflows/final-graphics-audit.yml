name: Final asteroid graphics audit

on:
  push:
    branches:
      - graphics/material-restoration
    paths:
      - '.github/workflows/final-graphics-audit.yml'
      - 'scripts/restore-material-art.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned graphics and Lua validation tools
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.3.3' 'luaparser==3.3.0'
      - name: Parse Lua sources without running Factorio
        run: |
          python - <<'PY'
          from luaparser import ast
          from pathlib import Path
          for path in (Path('asteroids.lua'), Path('recipe.lua'), Path('item.lua'),
                       Path('prototypes/compat/recipe_icons.lua')):
              ast.parse(path.read_text())
              print('Lua parsed:', path)
          s = Path('asteroids.lua').read_text()
          for name,material in (('crystalline','metallic'),
                                ('halide','oxide'),('electrostatic','metallic')):
              assert f'["{name}"] = "{material}"' in s, name
          assert 'Material-matched scene lighting' not in s
          PY
      - name: Render original source artwork with masked material edits
        run: python scripts/restore-material-art.py
      - name: Verify pixel-identical arrow regions and deterministic sprites
        run: python scripts/restore-material-art.py --verify
      - name: Check all 96 graphics are correctly shaped
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          icons = sorted(Path('graphics/icons').glob('*.png'))
          entities = sorted(Path('graphics/entity/asteroid').rglob('*-colour-01.png'))
          assert len(icons) == 56, len(icons)
          assert len(entities) == 40, len(entities)
          for f in icons:
              with Image.open(f) as im:
                  assert im.size == (64, 64), f
                  assert im.convert('RGBA').getchannel('A').getextrema() == (0, 255), f
          for f in entities:
              with Image.open(f) as im:
                  assert im.width == im.height, (f,im.size)
                  assert im.convert('RGBA').getchannel('A').getextrema()[1] == 255, f
          print('PASS:',len(icons),'icons,',len(entities),'entity textures')
          PY
      - name: Commit rendered PNGs only on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics/icons graphics/entity/asteroid
          if ! git diff --cached --quiet; then
            git commit -m "art(asteroids): finalize original material textures and selective icon highlights"
            git push origin HEAD:graphics/material-restoration
          else
            echo "All generated assets already match the committed files."
          fi
