name: Render precise asteroid-only material edits

on:
  push:
    branches:
      - graphics/material-restoration
    paths:
      - scripts/restore-material-art.py
      - .github/workflows/render-masked-asteroids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image libraries
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.3.3'
      - name: Restore upstream art and rebuild only masked asteroid mineral detail
        run: python scripts/restore-material-art.py
      - name: Check asset counts and alpha channels
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          icons = list(Path("graphics/icons").glob("*.png"))
          textures = list(Path("graphics/entity/asteroid").rglob("*-colour-01.png"))
          assert len(icons) == 56, len(icons)
          assert len(textures) == 40, len(textures)
          for path in icons:
              with Image.open(path) as im:
                  assert im.size == (64, 64), (path, im.size)
                  assert im.convert("RGBA").getchannel("A").getextrema() == (0, 255), path
          for path in textures:
              with Image.open(path) as im:
                  assert im.convert("RGBA").getchannel("A").getextrema()[1] == 255, path
          print("Validated 56 main-mip icons, 40 diffuse sprites, and alpha")
          PY
      - name: Commit rendered sprites to isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics/icons graphics/entity/asteroid
          if ! git diff --cached --quiet; then
            git commit -m "art(asteroids): render sparse asteroid-only mineral accents from original sprites"
            git push origin HEAD:graphics/material-restoration
          fi
