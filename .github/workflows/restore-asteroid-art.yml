name: Restore asteroid material artwork

on:
  push:
    branches:
      - graphics/material-restoration
    paths:
      - 'scripts/restore-material-art.py'
      - '.github/workflows/restore-asteroid-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout graphics branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic graphics dependencies
        run: python -m pip install 'Pillow==11.3.0' 'numpy==2.3.3'
      - name: Regenerate material artwork
        run: python scripts/restore-material-art.py
      - name: Verify all icon dimensions and nonempty transparency
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for file in sorted(Path('graphics/icons').glob('*.png')):
              with Image.open(file) as im:
                  assert im.size == (64, 64), f'{file}: {im.size}'
                  rgba = im.convert('RGBA')
                  assert rgba.getchannel('A').getextrema()[1] > 0, file
          print('All icon dimensions and alpha channels verified.')
          PY
      - name: Commit restored PNG assets to the graphics branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics/icons graphics/entity/asteroid
          if ! git diff --cached --quiet; then
            git commit -m "art(asteroids): restore detailed material colours and crushing icons"
            git push origin HEAD:graphics/material-restoration
          else
            echo "No graphics changed."
          fi
